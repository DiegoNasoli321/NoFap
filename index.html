<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoFap Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>NoFap</h1>
  <div id="timer">00 dias, 00 horas, 00 minutos, 00 segundos</div>

  <div class="progress-container">
    <label>DIA (24h)</label>
    <div class="progress-wrapper">
      <span id="dayCycles" class="cycle-count"></span>
      <div class="progress-bar">
        <div id="dayBar" class="progress-fill"></div>
        <span id="dayPercent" class="progress-text">0%</span>
      </div>
    </div>
  </div>

  <div class="progress-container">
    <label>SEMANA (7 dias)</label>
    <div class="progress-wrapper">
      <span id="weekCycles" class="cycle-count"></span>
      <div class="progress-bar">
        <div id="weekBar" class="progress-fill"></div>
        <span id="weekPercent" class="progress-text">0%</span>
      </div>
    </div>
  </div>

  <div class="progress-container">
    <label>MÊS (30 dias)</label>
    <div class="progress-wrapper">
      <span id="monthCycles" class="cycle-count"></span>
      <div class="progress-bar">
        <div id="monthBar" class="progress-fill"></div>
        <span id="monthPercent" class="progress-text">0%</span>
      </div>
    </div>
  </div>

  <!-- Botão de recaída abaixo da última barra -->
  <button id="resetBtn">💔 Recaída</button>

  <!-- Botão de zerar recaídas no canto superior direito -->
  <button id="clearRelapsesBtn">Zerar recaídas</button>

  <p id="relapses">0 Recaídas</p>

  <div id="calendar">
  <!-- Cada mês terá um título e os dias -->
</div>


  <script src="script.js"></script>
</body>
</html>
