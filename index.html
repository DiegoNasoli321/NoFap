<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoFap Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>NoFap</h1>
  <div id="timer">00 dias, 00 horas, 00 minutos, 00 segundos</div>

  <div class="progress-container">
    <label>DIA (24h)</label>
    <div class="progress-bar">
      <div id="dayBar" class="progress-fill">0%</div>
    </div>
  </div>

  <div class="progress-container">
    <label>SEMANA (7 dias)</label>
    <div class="progress-bar">
      <div id="weekBar" class="progress-fill">0%</div>
    </div>
  </div>

  <div class="progress-container">
    <label>MÊS (30 dias)</label>
    <div class="progress-bar">
      <div id="monthBar" class="progress-fill">0%</div>
    </div>
  </div>

  <button id="resetBtn">Resetar contador</button>

  <script src="script.js"></script>
</body>
</html>
